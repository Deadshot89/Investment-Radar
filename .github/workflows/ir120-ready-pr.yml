name: IR120 Ready PR

on:
  push:
    branches:
      - ir120-implementation
    paths:
      - '.github/workflows/ir120-ready-pr.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR 4 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 4 --repo Deadshot89/Investment-Radar

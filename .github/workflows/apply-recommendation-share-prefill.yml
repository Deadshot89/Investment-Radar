name: Apply Recommendation Share Prefill

on:
  push:
    paths:
      - '.github/workflows/apply-recommendation-share-prefill.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch MainActivity
        run: python .github/scripts/apply_recommendation_share_prefill.py
      - name: Commit recommendation share prefill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt
          git commit -m "feat: prefill recommended trade shares"
          git push origin HEAD:main

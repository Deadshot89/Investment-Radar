name: Deploy Backend

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Syntax check
        working-directory: backend
        run: npm run check

      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: Live radar data quality audit
        if: startsWith(github.ref, 'refs/heads/audit/')
        shell: bash
        env:
          BASE_URL: ${{ vars.INVESTMENT_API_BASE_URL }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const base=String(process.env.BASE_URL||'').replace(/\/$/,'');
          if(!base.startsWith('https://')) throw new Error('INVESTMENT_API_BASE_URL missing');
          const get=async (url,ms=60000)=>{const r=await fetch(url,{signal:AbortSignal.timeout(ms),headers:{Accept:'application/json'}});const t=await r.text();let j;try{j=JSON.parse(t)}catch{throw new Error('non-JSON '+r.status+' '+t.slice(0,200))}if(!r.ok)throw new Error('HTTP '+r.status+' '+JSON.stringify(j).slice(0,300));return j};
          const health=await get(base+'/api/health',30000);
          const rows=[]; const pageErrors=[]; let page=1,total=null,universeTotal=null;
          while(page<=30){
            try{
              const j=await get(base+'/api/radar?page='+page+'&pageSize=100&sort=NAME');
              total ??= Number(j.total||0); universeTotal ??= Number(j.universeTotal||total||0);
              const xs=Array.isArray(j.items)?j.items:[]; rows.push(...xs);
              console.log('AUDIT_PAGE '+page+' items='+xs.length+' accumulated='+rows.length+'/'+total+' hasMore='+Boolean(j.hasMore));
              if(!j.hasMore||xs.length===0) break; page++;
            }catch(e){pageErrors.push({page,error:String(e?.message||e)});console.log('AUDIT_PAGE_ERROR '+page+' '+String(e?.message||e));break}
          }
          const byId=new Map(rows.filter(Boolean).map(x=>[x.id,x])); const all=[...byId.values()];
          const n=v=>Number(v); const finite=v=>Number.isFinite(n(v)); const etf=x=>String(x?.type||'').toUpperCase()==='ETF';
          const q=(x,k)=>n(x?.dataQuality?.[k]); const miss=(x,b)=>(x?.dataQuality?.missingBlocks||[]).includes(b);
          const err=(x,b)=>x?.providerStatus?.[b]?.error||x?.diagnostics?.providerStatus?.[b]?.error||null;
          const pct=(a,b)=>b?Number((100*a/b).toFixed(1)):0;
          const avg=xs=>{xs=xs.map(n).filter(Number.isFinite);return xs.length?Number((xs.reduce((a,b)=>a+b,0)/xs.length).toFixed(1)):null};
          const med=xs=>{xs=xs.map(n).filter(Number.isFinite).sort((a,b)=>a-b);if(!xs.length)return null;const m=Math.floor(xs.length/2);return xs.length%2?xs[m]:Number(((xs[m-1]+xs[m])/2).toFixed(1))};
          const countBy=f=>{const o={};for(const x of all){const k=String(f(x)??'UNKNOWN');o[k]=(o[k]||0)+1}return Object.fromEntries(Object.entries(o).sort((a,b)=>b[1]-a[1]))};
          const stocks=all.filter(x=>!etf(x));
          const quote=all.filter(x=>!finite(q(x,'quoteCoverage'))||q(x,'quoteCoverage')<100||x.price==null||miss(x,'quote'));
          const history=all.filter(x=>!finite(q(x,'historyCoverage'))||q(x,'historyCoverage')<70||miss(x,'history'));
          const fundamentals=stocks.filter(x=>!finite(q(x,'fundamentalCoverage'))||q(x,'fundamentalCoverage')<60||miss(x,'fundamentals'));
          const forecast=all.filter(x=>!finite(q(x,'forecastInputCoverage'))||q(x,'forecastInputCoverage')<70||miss(x,'forecast')||x?.forecast?.quality==='NICHT_BELASTBAR');
          const overall70=all.filter(x=>!finite(q(x,'overallCoverage'))||q(x,'overallCoverage')<70);
          const severe=all.filter(x=>!finite(q(x,'quoteCoverage'))||q(x,'quoteCoverage')<100||!finite(q(x,'historyCoverage'))||q(x,'historyCoverage')<50||(!etf(x)&&(!finite(q(x,'fundamentalCoverage'))||q(x,'fundamentalCoverage')<50))||!finite(q(x,'overallCoverage'))||q(x,'overallCoverage')<50);
          const providerErrors=all.filter(x=>['quote','history','fundamentals'].some(b=>err(x,b)));
          const conflicts=all.filter(x=>(x?.dataQuality?.criticalConflicts||[]).length>0);
          const staleHistory=all.filter(x=>x?.diagnostics?.historyStale===true||x?.providerStatus?.history?.stale===true);
          const staleFund=stocks.filter(x=>x?.diagnostics?.fundamentalsStale===true||x?.providerStatus?.fundamentals?.stale===true);
          const worst=[...all].sort((a,b)=>(q(a,'overallCoverage')||0)-(q(b,'overallCoverage')||0)).slice(0,40).map(x=>({id:x.id,name:x.name,ticker:x.ticker,type:x.type,overall:x?.dataQuality?.overallCoverage??x.coverage??null,quote:x?.dataQuality?.quoteCoverage??null,history:x?.dataQuality?.historyCoverage??null,fundamentals:x?.dataQuality?.fundamentalCoverage??null,forecastInputs:x?.dataQuality?.forecastInputCoverage??null,missing:x?.dataQuality?.missingBlocks||[],quoteError:err(x,'quote'),historyError:err(x,'history'),fundamentalError:err(x,'fundamentals'),forecastQuality:x?.forecast?.quality??null,recommendation:x.recommendation,purchaseEligible:Boolean(x.purchaseEligible)}));
          const summarizeGap=(x)=>({id:x.id,name:x.name,ticker:x.ticker,isin:x.isin,type:x.type,country:x.country,region:x.region,overall:x?.dataQuality?.overallCoverage??x.coverage??null,quote:x?.dataQuality?.quoteCoverage??null,history:x?.dataQuality?.historyCoverage??null,fundamentals:x?.dataQuality?.fundamentalCoverage??null,forecastInputs:x?.dataQuality?.forecastInputCoverage??null,missing:x?.dataQuality?.missingBlocks||[],fundamentalSource:x?.diagnostics?.fundamentalSource||x?.providerStatus?.fundamentals?.source||null,fundamentalError:err(x,'fundamentals'),historySource:x?.diagnostics?.historySource||x?.providerStatus?.history?.source||null,historyError:err(x,'history'),forecastQuality:x?.forecast?.quality??null});
          const report={auditedAt:new Date().toISOString(),health:{ok:health.ok,service:health.service,backendVersion:health.backendVersion,apiSchemaVersion:health.apiSchemaVersion,sourceRevision:health.sourceRevision,deployId:health.deployId,marketDataConfigured:health.marketDataConfigured,fundamentalDataConfigured:health.fundamentalDataConfigured,analysisModel:health.analysisModel,universeTarget:health.universeTarget},universe:{expectedTotal:total,universeTotal,fetched:all.length,duplicates:rows.length-all.length,pageErrors},types:countBy(x=>x.type),qualityTiers:countBy(x=>x?.dataQuality?.qualityTier||x?.dataQualityTier),recommendations:countBy(x=>x.recommendation),forecastQuality:countBy(x=>x?.forecast?.quality||'MISSING'),coverage:{overallAverage:avg(all.map(x=>q(x,'overallCoverage'))),overallMedian:med(all.map(x=>q(x,'overallCoverage'))),quoteAverage:avg(all.map(x=>q(x,'quoteCoverage'))),historyAverage:avg(all.map(x=>q(x,'historyCoverage'))),fundamentalStocksAverage:avg(stocks.map(x=>q(x,'fundamentalCoverage'))),forecastInputAverage:avg(all.map(x=>q(x,'forecastInputCoverage')))},gaps:{quote:{count:quote.length,pct:pct(quote.length,all.length)},history:{count:history.length,pct:pct(history.length,all.length)},fundamentalsStocks:{count:fundamentals.length,pct:pct(fundamentals.length,stocks.length)},forecast:{count:forecast.length,pct:pct(forecast.length,all.length)},overallBelow70:{count:overall70.length,pct:pct(overall70.length,all.length)},severe:{count:severe.length,pct:pct(severe.length,all.length)},providerErrors:{count:providerErrors.length,pct:pct(providerErrors.length,all.length)},criticalConflicts:{count:conflicts.length,pct:pct(conflicts.length,all.length)},historyStale:{count:staleHistory.length,pct:pct(staleHistory.length,all.length)},fundamentalsStaleStocks:{count:staleFund.length,pct:pct(staleFund.length,stocks.length)}},purchaseEligible:{count:all.filter(x=>x.purchaseEligible===true).length,pct:pct(all.filter(x=>x.purchaseEligible===true).length,all.length)},worstCoverage:worst,providerErrorSamples:providerErrors.slice(0,40).map(x=>({id:x.id,name:x.name,ticker:x.ticker,quote:err(x,'quote'),history:err(x,'history'),fundamentals:err(x,'fundamentals')})),fundamentalGaps:fundamentals.map(summarizeGap),historyGaps:history.map(summarizeGap)};
          console.log('LIVE_DATA_AUDIT_JSON_BEGIN'); console.log(JSON.stringify(report)); console.log('LIVE_DATA_AUDIT_JSON_END');
          NODE
      - name: Check Azure configuration
        if: github.ref == 'refs/heads/main'
        id: azure_config
        shell: bash
        env:
          APP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          BASE_URL: ${{ vars.INVESTMENT_API_BASE_URL }}
        run: |
          if [ -n "$APP_NAME" ] && [ -n "$PUBLISH_PROFILE" ] && [[ "$BASE_URL" =~ ^https://[^/]+ ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Azure deployment configuration found."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "## Backend Deploy" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ Azure ist noch nicht eingerichtet. Es wurde kein Backend veröffentlicht." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Benötigt:" >> "$GITHUB_STEP_SUMMARY"
            echo "- Variable: AZURE_FUNCTIONAPP_NAME" >> "$GITHUB_STEP_SUMMARY"
            echo "- Secret: AZURE_FUNCTIONAPP_PUBLISH_PROFILE" >> "$GITHUB_STEP_SUMMARY"
            echo "- Variable: INVESTMENT_API_BASE_URL (vollstaendige Flex-Standarddomain mit https://)" >> "$GITHUB_STEP_SUMMARY"
            echo "Azure configuration missing; stopping before a misleading green deploy."
            exit 2
          fi

      - name: Create immutable deploy package
        if: github.ref == 'refs/heads/main' && steps.azure_config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_ID="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          BACKEND_REVISION="$(git rev-parse HEAD:backend)"
          export DEPLOY_ID BACKEND_REVISION
          echo "DEPLOY_ID=$DEPLOY_ID" >> "$GITHUB_ENV"
          echo "BACKEND_REVISION=$BACKEND_REVISION" >> "$GITHUB_ENV"
          echo "=== Backend evidence before packaging ==="
          echo "Commit: $GITHUB_SHA"
          echo "Backend tree revision: $BACKEND_REVISION"
          echo "Deploy ID: $DEPLOY_ID"
          echo "package.json version: $(node -p "require('./backend/package.json').version")"
          echo "health.mjs backendVersion: $(grep -o 'backendVersion: "[^"]*"' backend/src/functions/health.mjs | head -1 || true)"
          printf '%s\n' "$DEPLOY_ID" > backend/.deploy-id
          node -e 'const fs=require("fs"); fs.writeFileSync("backend/build-info.json", JSON.stringify({sourceRevision: process.env.BACKEND_REVISION, deployId: process.env.DEPLOY_ID}, null, 2))'
          rm -f backend-deploy.zip
          (cd backend && zip -qr ../backend-deploy.zip . -x 'node_modules/*')
          echo "Deploy package SHA-256:"
          sha256sum backend-deploy.zip
          echo "Deploy package contents (diagnostic files):"
          unzip -p backend-deploy.zip package.json | head -40
          unzip -p backend-deploy.zip src/functions/health.mjs | head -80
          unzip -p backend-deploy.zip .deploy-id
          unzip -p backend-deploy.zip build-info.json

      - name: Deploy Azure Functions
        if: github.ref == 'refs/heads/main' && steps.azure_config.outputs.configured == 'true'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: backend-deploy.zip
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          sku: flexconsumption
          remote-build: true

      - name: Verify live backend
        if: github.ref == 'refs/heads/main' && steps.azure_config.outputs.configured == 'true'
        shell: bash
        env:
          BASE_URL: ${{ vars.INVESTMENT_API_BASE_URL }}
          EXPECTED_BACKEND_VERSION: "2.1.0"
          EXPECTED_API_SCHEMA: "2026-09-14.1"
        run: |
          set -euo pipefail
          HEALTH_URL="${BASE_URL%/}/api/health"
          PUSH_URL="${BASE_URL%/}/api/test-push"
          CUSTOM_URL="${BASE_URL%/}/api/custom-quote"
          echo "Checking $HEALTH_URL for backendVersion=$EXPECTED_BACKEND_VERSION"

          HEALTH_OK=false
          LAST_VERSION=""
          LAST_REVISION=""
          LAST_DEPLOY_ID=""
          LAST_SCHEMA=""
          echo "Deploy ID submitted to Azure: ${DEPLOY_ID:-<missing>}"
          echo "Waiting up to 6 minutes for the Flex host to activate the new package..."
          for attempt in $(seq 1 24); do
            STATUS=$(curl --silent --show-error --max-time 20 --output /tmp/health-body.json --write-out "%{http_code}" "$HEALTH_URL" || true)
            echo "Health status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              LAST_VERSION=$(node -e 'const fs=require("fs"); try { const j=JSON.parse(fs.readFileSync("/tmp/health-body.json","utf8")); process.stdout.write(String(j.backendVersion ?? "")); } catch { process.stdout.write(""); }')
              LAST_REVISION=$(node -e 'const fs=require("fs"); try { const j=JSON.parse(fs.readFileSync("/tmp/health-body.json","utf8")); process.stdout.write(String(j.sourceRevision ?? "")); } catch { process.stdout.write(""); }')
              LAST_DEPLOY_ID=$(node -e 'const fs=require("fs"); try { const j=JSON.parse(fs.readFileSync("/tmp/health-body.json","utf8")); process.stdout.write(String(j.deployId ?? "")); } catch { process.stdout.write(""); }')
              LAST_SCHEMA=$(node -e 'const fs=require("fs"); try { const j=JSON.parse(fs.readFileSync("/tmp/health-body.json","utf8")); process.stdout.write(String(j.apiSchemaVersion ?? "")); } catch { process.stdout.write(""); }')
              echo "Live backendVersion: ${LAST_VERSION:-<missing>} revision=${LAST_REVISION:-<missing>} deploy=${LAST_DEPLOY_ID:-<missing>} schema=${LAST_SCHEMA:-<missing>}"
              if [ "$LAST_VERSION" = "$EXPECTED_BACKEND_VERSION" ] && [ "$LAST_REVISION" = "$BACKEND_REVISION" ] && [ "$LAST_DEPLOY_ID" = "$DEPLOY_ID" ] && [ "$LAST_SCHEMA" = "$EXPECTED_API_SCHEMA" ]; then
                HEALTH_OK=true
                break
              fi
            fi
            sleep 15
          done

          if [ "$HEALTH_OK" != "true" ]; then
            echo "❌ /api/health ist erreichbar, aber nicht mit Backend-Version $EXPECTED_BACKEND_VERSION." >> "$GITHUB_STEP_SUMMARY"
            echo "Gefundene Version: ${LAST_VERSION:-<fehlt>}" >> "$GITHUB_STEP_SUMMARY"
            echo "Erwartete Backend-Revision: $BACKEND_REVISION / live: ${LAST_REVISION:-<fehlt>}" >> "$GITHUB_STEP_SUMMARY"
            echo "Erwartete Deploy-ID: ${DEPLOY_ID:-<fehlt>} / live: ${LAST_DEPLOY_ID:-<fehlt>}" >> "$GITHUB_STEP_SUMMARY"
            echo "Erwartetes API-Schema: $EXPECTED_API_SCHEMA / live: ${LAST_SCHEMA:-<fehlt>}" >> "$GITHUB_STEP_SUMMARY"
            echo "Azure hat das Deployment akzeptiert, liefert aber weiterhin einen anderen Backend-Stand aus." >> "$GITHUB_STEP_SUMMARY"
            echo "Das ist jetzt als Aktivierungs-/Deploymentproblem eingegrenzt, nicht als Quellcode-Versionsproblem." >> "$GITHUB_STEP_SUMMARY"
            echo "Letzte Health-Antwort:" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/health-body.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            exit 1
          fi

          echo "Checking protected push route $PUSH_URL"
          PUSH_OK=false
          for attempt in 1 2 3 4 5 6; do
            STATUS=$(curl --silent --show-error --max-time 20 --output /tmp/push-route-body.txt --write-out "%{http_code}" -X POST \
              -H "Content-Type: application/json" \
              --data '{"level":"INFO","itemId":"deploy-check"}' \
              "$PUSH_URL" || true)
            echo "Push route status: $STATUS"
            if [ "$STATUS" = "401" ]; then
              PUSH_OK=true
              break
            fi
            sleep 10
          done

          if [ "$PUSH_OK" != "true" ]; then
            echo "❌ /api/test-push ist nicht korrekt registriert. Erwartet: HTTP 401 ohne Admin-Key." >> "$GITHUB_STEP_SUMMARY"
            echo "Letzte Antwort:" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/push-route-body.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            exit 1
          fi

          echo "Checking custom quote route $CUSTOM_URL"
          CUSTOM_STATUS=$(curl --silent --show-error --max-time 20 --output /tmp/custom-route-body.txt --write-out "%{http_code}" "$CUSTOM_URL" || true)
          echo "Custom quote route status: $CUSTOM_STATUS"
          if [ "$CUSTOM_STATUS" != "400" ]; then
            echo "❌ /api/custom-quote ist nicht korrekt registriert. Erwartet: HTTP 400 ohne Ticker." >> "$GITHUB_STEP_SUMMARY"
            echo "Letzte Antwort:" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/custom-route-body.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            exit 1
          fi

          echo "## Backend Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Backend-Version $EXPECTED_BACKEND_VERSION ist live: ${BASE_URL%/}" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Exakte Backend-Inhaltsrevision $BACKEND_REVISION und Deploy-ID $DEPLOY_ID sind live; API-Schema $EXPECTED_API_SCHEMA." >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Push-Test-Route /api/test-push ist registriert und geschützt (HTTP 401 ohne Admin-Key)." >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Eigene-Werte-Route /api/custom-quote ist registriert." >> "$GITHUB_STEP_SUMMARY"

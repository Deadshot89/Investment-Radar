name: Deploy Backend

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Syntax check
        working-directory: backend
        run: npm run check

      - name: Check Azure configuration
        id: azure_config
        shell: bash
        env:
          APP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          if [ -n "$APP_NAME" ] && [ -n "$PUBLISH_PROFILE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Azure deployment configuration found."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Azure deployment skipped: repository variable AZURE_FUNCTIONAPP_NAME and/or secret AZURE_FUNCTIONAPP_PUBLISH_PROFILE is not configured yet."
            echo "The backend syntax check passed, so this workflow is successful until Azure is configured."
          fi

      - name: Deploy Azure Functions
        if: steps.azure_config.outputs.configured == 'true'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: backend
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

      - name: Azure deployment pending setup
        if: steps.azure_config.outputs.configured != 'true'
        run: |
          echo "No Azure deployment was attempted."
          echo "Set AZURE_FUNCTIONAPP_NAME under Settings > Secrets and variables > Actions > Variables."
          echo "Set AZURE_FUNCTIONAPP_PUBLISH_PROFILE under Settings > Secrets and variables > Actions > Secrets."

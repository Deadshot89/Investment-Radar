name: Apply 2.2 Navigation Fix

on:
  push:
    branches:
      - feat/investment-radar-2.2
    paths:
      - '.github/workflows/apply-2-2-navigation-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/investment-radar-2.2
      - name: Remove nested detail back handler
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/src/main/java/de/tobias/investmentradar/InvestmentDetailScreen.kt')
          text = path.read_text()
          import_line = 'import androidx.activity.compose.BackHandler\n'
          handler = '    BackHandler { onBack() }\n\n'
          if text.count(import_line) != 1:
              raise SystemExit(f'Expected exactly one BackHandler import, got {text.count(import_line)}')
          if text.count(handler) != 1:
              raise SystemExit(f'Expected exactly one detail BackHandler, got {text.count(handler)}')
          text = text.replace(import_line, '', 1).replace(handler, '', 1)
          path.write_text(text)
          PY
      - name: Commit detail navigation fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/de/tobias/investmentradar/InvestmentDetailScreen.kt
          git diff --cached --check
          git commit -m "fix: route detail back through root navigation"
          git push origin HEAD:feat/investment-radar-2.2

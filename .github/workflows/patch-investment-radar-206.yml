name: Apply Investment Radar 2.0.6 patch

permissions:
  contents: write

on:
  push:
    branches:
      - feature/live-visual-forecast-2-0-6
    paths:
      - 'scripts/patch-investment-radar-206.py'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-visual-forecast-2-0-6
      - name: Apply deterministic source patch
        run: python3 scripts/patch-investment-radar-206.py
      - name: Commit patched sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/de/tobias/investmentradar/MainViewModel.kt \
                  android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt \
                  android/app/src/main/java/de/tobias/investmentradar/LiveForecastSummary.kt \
                  android/app/src/main/java/de/tobias/investmentradar/InvestmentDetailScreen.kt \
                  android/app/src/main/java/de/tobias/investmentradar/ForecastEngine.kt
          git diff --cached --quiet && exit 0
          git commit -m "feat: show radar buy candidates in live"
          git push origin HEAD:feature/live-visual-forecast-2-0-6

name: Launcher Recovery Signer Pin CI

on:
  push:
    branches:
      - launcher-recovery-signer-pin-ci
    paths:
      - 'launcher-recovery-ci/**'
      - '.github/workflows/launcher-recovery-p0-ci.yml'

permissions:
  contents: read

jobs:
  build-launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run launcher contract regression test
        working-directory: launcher-recovery-ci
        run: python3 tests/test_launcher_contract.py

      - name: Run release signing contract test
        working-directory: launcher-recovery-ci
        run: python3 tests/test_release_signing_contract.py

      - name: Run signer fingerprint guard regression test
        working-directory: launcher-recovery-ci
        run: bash tests/test_signer_fingerprint_guard.sh

      - name: Verify release refuses missing signing inputs
        working-directory: launcher-recovery-ci
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          set +e
          gradle --no-daemon :app:assembleRelease > build/release-missing-signing.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -q 'Missing required release signing environment variables' build/release-missing-signing.log

      - name: Build versioned release APKs and verify pinned signer
        working-directory: launcher-recovery-ci
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/upgrade
          TEST_KEYSTORE="$RUNNER_TEMP/launcher-ci-test.jks"
          keytool -genkeypair -noprompt \
            -keystore "$TEST_KEYSTORE" \
            -storepass launcher-ci-only \
            -alias launcher-ci \
            -keypass launcher-ci-only \
            -dname 'CN=Launcher CI Test,O=CI,C=DE' \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2
          export LAUNCHER_KEYSTORE_PATH="$TEST_KEYSTORE"
          export LAUNCHER_KEYSTORE_PASSWORD='launcher-ci-only'
          export LAUNCHER_KEY_ALIAS='launcher-ci'
          export LAUNCHER_KEY_PASSWORD='launcher-ci-only'

          gradle --no-daemon --stacktrace :app:assembleRelease \
            -PAPP_VERSION_CODE=1 \
            -PAPP_VERSION_NAME=0.1.0-upgrade-base
          cp app/build/outputs/apk/release/app-release.apk build/upgrade/launcher-v1.apk

          gradle --no-daemon --rerun-tasks --stacktrace :app:assembleRelease \
            -PAPP_VERSION_CODE=2 \
            -PAPP_VERSION_NAME=0.1.1-upgrade-target
          cp app/build/outputs/apk/release/app-release.apk build/upgrade/launcher-v2.apk

          for apk in build/upgrade/launcher-v1.apk build/upgrade/launcher-v2.apk; do
            test -s "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
            test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest debuggable "$apk" | tr -d '\r')" = "false"
          done

          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-code build/upgrade/launcher-v1.apk | tr -d '\r')" = "1"
          test "$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-code build/upgrade/launcher-v2.apk | tr -d '\r')" = "2"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs build/upgrade/launcher-v1.apk | grep 'Signer #1 certificate SHA-256 digest:' | tee build/upgrade/signer-v1.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs build/upgrade/launcher-v2.apk | grep 'Signer #1 certificate SHA-256 digest:' | tee build/upgrade/signer-v2.txt
          diff -u build/upgrade/signer-v1.txt build/upgrade/signer-v2.txt

          EXPECTED_SIGNING_CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' build/upgrade/signer-v1.txt)"
          export EXPECTED_SIGNING_CERT_SHA256
          scripts/verify-release-signer.sh build/upgrade/launcher-v2.apk | tee build/upgrade/signer-pin-match.txt

          set +e
          EXPECTED_SIGNING_CERT_SHA256='FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF' \
            scripts/verify-release-signer.sh build/upgrade/launcher-v2.apk \
            > build/upgrade/signer-pin-mismatch.out \
            2> build/upgrade/signer-pin-mismatch.err
          mismatch_code=$?
          set -e
          test "$mismatch_code" -eq 9
          grep -q 'Signing certificate SHA-256 mismatch' build/upgrade/signer-pin-mismatch.err

          cp build/upgrade/launcher-v2.apk app/build/outputs/apk/release/app-release.apk
          scripts/verify-release-signer.sh app/build/outputs/apk/release/app-release.apk | tee build/release-apksigner.txt
          sha256sum app/build/outputs/apk/release/app-release.apk | tee build/release-apk-sha256.txt

      - name: Build debug APK
        working-directory: launcher-recovery-ci
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK and launcher manifest
        working-directory: launcher-recovery-ci
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee build/apksigner.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > build/manifest.xml
          grep -q 'android.intent.category.HOME' build/manifest.xml
          grep -q 'android.intent.category.DEFAULT' build/manifest.xml
          grep -q 'android.intent.category.LAUNCHER' build/manifest.xml
          if grep -q 'android.permission.QUERY_ALL_PACKAGES' build/manifest.xml; then
            echo 'Forbidden QUERY_ALL_PACKAGES permission found in built APK.' >&2
            exit 1
          fi
          sha256sum "$APK" | tee build/apk-sha256.txt

      - name: Run P0 signed upgrade and launcher lifecycle tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd launcher-recovery-ci && bash tests/device_upgrade_smoke.sh && bash tests/device_smoke.sh

      - name: Upload verified APK and device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-recovery-signer-pin-ci
          path: |
            launcher-recovery-ci/app/build/outputs/apk/debug/app-debug.apk
            launcher-recovery-ci/app/build/outputs/apk/release/app-release.apk
            launcher-recovery-ci/build/apksigner.txt
            launcher-recovery-ci/build/manifest.xml
            launcher-recovery-ci/build/apk-sha256.txt
            launcher-recovery-ci/build/release-apksigner.txt
            launcher-recovery-ci/build/release-apk-sha256.txt
            launcher-recovery-ci/build/release-missing-signing.log
            launcher-recovery-ci/build/upgrade/**
            launcher-recovery-ci/build/device-upgrade/**
            launcher-recovery-ci/build/device/**
          if-no-files-found: warn
          retention-days: 7

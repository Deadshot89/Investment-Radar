name: Launcher Recovery P0 CI

on:
  push:
    branches:
      - launcher-recovery-p0-ci
    paths:
      - 'launcher-recovery-ci/**'
      - '.github/workflows/launcher-recovery-p0-ci.yml'

permissions:
  contents: read

jobs:
  build-launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run launcher contract regression test
        working-directory: launcher-recovery-ci
        run: python3 tests/test_launcher_contract.py

      - name: Build debug APK
        working-directory: launcher-recovery-ci
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK and launcher manifest
        working-directory: launcher-recovery-ci
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee build/apksigner.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > build/manifest.xml
          grep -q 'android.intent.category.HOME' build/manifest.xml
          grep -q 'android.intent.category.DEFAULT' build/manifest.xml
          grep -q 'android.intent.category.LAUNCHER' build/manifest.xml
          if grep -q 'android.permission.QUERY_ALL_PACKAGES' build/manifest.xml; then
            echo 'Forbidden QUERY_ALL_PACKAGES permission found in built APK.' >&2
            exit 1
          fi
          sha256sum "$APK" | tee build/apk-sha256.txt

      - name: Run P0 launcher device smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            cd launcher-recovery-ci
            mkdir -p build/device
            APK="app/build/outputs/apk/debug/app-debug.apk"
            PKG="de.tobias.launcher.recovery"
            COMPONENT="$PKG/.MainActivity"

            adb install -r "$APK" | tee build/device/install.txt
            adb shell pm list packages | tr -d '\r' | grep -Fx "package:$PKG"

            adb shell cmd package set-home-activity --user 0 "$COMPONENT" | tee build/device/set-home.txt
            adb shell cmd package resolve-activity --brief --user 0 -a android.intent.action.MAIN -c android.intent.category.HOME | tr -d '\r' | tee build/device/home-resolved.txt
            grep -q "$PKG" build/device/home-resolved.txt

            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.HOME | tee build/device/home-start.txt
            sleep 2
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' | head -20 | tee build/device/home-foreground.txt
            grep -q "$PKG" build/device/home-foreground.txt
            adb exec-out screencap -p > build/device/home.png

            tap_text() {
              local wanted="$1"
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml build/device/window.xml >/dev/null
              coords=$(python3 - "$wanted" <<'PY'
import re, sys, xml.etree.ElementTree as ET
wanted=sys.argv[1]
root=ET.parse("build/device/window.xml").getroot()
for node in root.iter("node"):
    if node.attrib.get("text") == wanted:
        m=re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.attrib.get("bounds",""))
        if m:
            x1,y1,x2,y2=map(int,m.groups())
            print((x1+x2)//2, (y1+y2)//2)
            raise SystemExit(0)
raise SystemExit("text not found: "+wanted)
PY
)
              adb shell input tap $coords
              sleep 2
            }

            tap_text "Apps"
            adb exec-out screencap -p > build/device/drawer.png
            adb shell uiautomator dump /sdcard/drawer.xml >/dev/null
            adb pull /sdcard/drawer.xml build/device/drawer.xml >/dev/null
            grep -q 'text="Settings"' build/device/drawer.xml
            cp build/device/drawer.xml build/device/window.xml
            coords=$(python3 - <<'PY'
import re, xml.etree.ElementTree as ET
root=ET.parse("build/device/window.xml").getroot()
for node in root.iter("node"):
    if node.attrib.get("text") == "Settings":
        m=re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.attrib.get("bounds",""))
        if m:
            x1,y1,x2,y2=map(int,m.groups())
            print((x1+x2)//2, (y1+y2)//2)
            raise SystemExit(0)
raise SystemExit("Settings not found")
PY
)
            adb shell input tap $coords
            sleep 2
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' | head -20 | tee build/device/app-launch-foreground.txt
            grep -q 'com.android.settings' build/device/app-launch-foreground.txt

            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' | head -20 | tee build/device/home-after-app.txt
            grep -q "$PKG" build/device/home-after-app.txt

            adb shell am force-stop "$PKG"
            sleep 1
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' | head -20 | tee build/device/home-after-force-stop.txt
            grep -q "$PKG" build/device/home-after-force-stop.txt

            adb reboot
            adb wait-for-device
            for i in $(seq 1 90); do
              if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                break
              fi
              sleep 2
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb shell input keyevent KEYCODE_HOME
            sleep 3
            adb shell cmd package resolve-activity --brief --user 0 -a android.intent.action.MAIN -c android.intent.category.HOME | tr -d '\r' | tee build/device/home-resolved-after-reboot.txt
            grep -q "$PKG" build/device/home-resolved-after-reboot.txt
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' | head -20 | tee build/device/home-after-reboot.txt
            grep -q "$PKG" build/device/home-after-reboot.txt
            adb exec-out screencap -p > build/device/home-after-reboot.png

            adb logcat -d -v brief > build/device/logcat.txt
            if grep -A20 -B5 'FATAL EXCEPTION' build/device/logcat.txt | grep -q "$PKG"; then
              echo "Launcher crash found in logcat" >&2
              exit 1
            fi

            printf '%s\n'               'PASS: APK install'               'PASS: default HOME resolution'               'PASS: HOME foreground'               'PASS: app drawer'               'PASS: launch Settings from drawer'               'PASS: return HOME'               'PASS: HOME after force-stop'               'PASS: default HOME persisted after reboot'               'PASS: HOME foreground after reboot'               'PASS: no launcher fatal exception in logcat'               | tee build/device/RESULT.txt

      - name: Upload verified APK and device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-recovery-p0-device-test
          path: |
            launcher-recovery-ci/app/build/outputs/apk/debug/app-debug.apk
            launcher-recovery-ci/build/apksigner.txt
            launcher-recovery-ci/build/manifest.xml
            launcher-recovery-ci/build/apk-sha256.txt
            launcher-recovery-ci/build/device/**
          if-no-files-found: warn
          retention-days: 7

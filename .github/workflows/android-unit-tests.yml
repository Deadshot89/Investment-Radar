name: Android JVM Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-unit-tests.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore signing key for Gradle configuration
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/investment-radar-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Android JVM unit tests
        working-directory: android
        env:
          API_URL: ${{ vars.INVESTMENT_API_BASE_URL }}
          FB_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FB_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FB_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FB_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          REPOSITORY_SLUG: ${{ github.repository }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          gradle --no-daemon :app:testDebugUnitTest \
            -PINVESTMENT_API_BASE_URL="$API_URL" \
            -PFIREBASE_APP_ID="$FB_APP_ID" \
            -PFIREBASE_API_KEY="$FB_API_KEY" \
            -PFIREBASE_PROJECT_ID="$FB_PROJECT_ID" \
            -PFIREBASE_SENDER_ID="$FB_SENDER_ID" \
            -PGITHUB_REPOSITORY="$REPOSITORY_SLUG" \
            -PANDROID_KEYSTORE_PATH="$ANDROID_KEYSTORE_PATH" \
            -PANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PANDROID_KEY_ALIAS="$KEY_ALIAS" \
            -PANDROID_KEY_PASSWORD="$KEY_PASSWORD"

name: Deepfix Release Docs Patch

on:
  push:
    branches:
      - deepfix/german-money-input-2.5.34
    paths:
      - .github/workflows/deepfix-version-docs-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: deepfix/german-money-input-2.5.34
          fetch-depth: 0
      - name: Synchronize current release docs only
        shell: python
        run: |
          from pathlib import Path

          files = [Path("README.md"), Path("android/README.md"), Path("START_HIER.md"), Path("SETUP.md")]
          for path in files:
              text = path.read_text(encoding="utf-8")
              if "2.5.33" not in text:
                  raise SystemExit(f"Expected 2.5.33 in {path}")
              updated = text.replace("2.5.33", "2.5.34")
              updated = updated.replace("versionCode 103", "versionCode 104")
              updated = updated.replace("versionCode = 103", "versionCode = 104")
              updated = updated.replace("**versionCode:** 103", "**versionCode:** 104")
              path.write_text(updated, encoding="utf-8")
      - name: Verify docs-only patch and remove helper workflow
        run: |
          set -euo pipefail
          git diff --check
          git diff -- README.md android/README.md START_HIER.md SETUP.md
          git rm .github/workflows/deepfix-version-docs-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md android/README.md START_HIER.md SETUP.md
          git commit -m "docs: synchronize Android 2.5.34 release metadata"
          git push origin HEAD:deepfix/german-money-input-2.5.34

name: Finalize Android 2.5.42 metadata

on:
  push:
    branches:
      - fix/full-portfolio-concentration
    paths:
      - '.github/workflows/apply-full-portfolio-concentration.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/full-portfolio-concentration
      - name: Update release contracts and current docs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'android/tests/test-version-contract.sh',
              'EXPECTED_VERSION_NAME="2.5.41"\nEXPECTED_VERSION_CODE=111',
              'EXPECTED_VERSION_NAME="2.5.42"\nEXPECTED_VERSION_CODE=112'
          )
          replace_once(
              'SETUP.md',
              '- `versionName = 2.5.41`\n- `versionCode = 111`',
              '- `versionName = 2.5.42`\n- `versionCode = 112`'
          )
          replace_once(
              'START_HIER.md',
              '# START HIER – Investment Radar 2.5.41\n\n**Android:** 2.5.41 / versionCode 111',
              '# START HIER – Investment Radar 2.5.42\n\n**Android:** 2.5.42 / versionCode 112'
          )
          replace_once(
              'android/README.md',
              '**Version:** 2.5.41  \n**versionCode:** 111',
              '**Version:** 2.5.42  \n**versionCode:** 112'
          )
          replace_once(
              'README.md',
              '**Aktueller Android-Stand:** 2.5.41 / versionCode 111',
              '**Aktueller Android-Stand:** 2.5.42 / versionCode 112'
          )
          PY

          git diff --check
          git diff --exit-code --quiet && { echo 'No metadata changes produced'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/tests/test-version-contract.sh SETUP.md START_HIER.md android/README.md README.md
          git commit -m 'docs: prepare Android 2.5.42 release metadata'
          git push origin HEAD:fix/full-portfolio-concentration

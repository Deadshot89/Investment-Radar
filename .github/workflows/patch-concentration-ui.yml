name: One-shot concentration UI patch

on:
  push:
    branches:
      - fix/concentration-budget-fallback-20261009
    paths:
      - .github/workflows/patch-concentration-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/concentration-budget-fallback-20261009
      - name: Wire live concentration warning
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt')
          text = path.read_text()
          old = '    val concentrationWarning: Pair<InvestmentItem, Double>? = null\n'
          new = '''    val concentrationWarning: Pair<InvestmentItem, Double>? = PortfolioAnalysis.leadingConcentration(portfolioValues)\n        ?.let { (itemId, sharePct) ->\n            data.items.firstOrNull { it.id == itemId }?.let { item -> item to sharePct }\n        }\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one disabled concentration warning, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt
          git commit -m 'fix: show dominant portfolio concentration on live dashboard'
          git push origin HEAD:fix/concentration-budget-fallback-20261009

name: Apply Android 2.5.48 release

on:
  push:
    branches:
      - fix/portfolio-missing-value-reason
    paths:
      - '.github/workflows/apply-2-5-48-release.yml'

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/portfolio-missing-value-reason
      - name: Update release metadata and documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old!r}")
              p.write_text(text.replace(old, new, count))

          replace('android/app/build.gradle.kts', 'versionCode = 117', 'versionCode = 118')
          replace('android/app/build.gradle.kts', 'versionName = "2.5.47"', 'versionName = "2.5.48"')
          replace('android/app/build.gradle.kts', '// Release candidate: Investment Radar 2.5.47', '// Release candidate: Investment Radar 2.5.48')

          replace('README.md', '**Aktueller Android-Stand:** 2.5.47 / versionCode 117', '**Aktueller Android-Stand:** 2.5.48 / versionCode 118')
          replace('SETUP.md', '`versionName = 2.5.47`', '`versionName = 2.5.48`')
          replace('SETUP.md', '`versionCode = 117`', '`versionCode = 118`')
          replace('START_HIER.md', '# START HIER – Investment Radar 2.5.47', '# START HIER – Investment Radar 2.5.48')
          replace('START_HIER.md', '**Android:** 2.5.47 / versionCode 117', '**Android:** 2.5.48 / versionCode 118')
          replace('START_HIER.md', '`versionName = 2.5.47`', '`versionName = 2.5.48`')
          replace('START_HIER.md', '`versionCode = 117`', '`versionCode = 118`')

          p = Path('android/README.md')
          text = p.read_text()
          if '**Version:** 2.5.47  ' not in text or '**versionCode:** 117' not in text:
              raise SystemExit('missing current Android README version metadata')
          text = text.replace('**Version:** 2.5.47  ', '**Version:** 2.5.48  ', 1)
          text = text.replace('**versionCode:** 117', '**versionCode:** 118', 1)
          marker = '### Änderung in 2.5.47\n'
          if marker not in text:
              raise SystemExit('missing 2.5.47 release-note marker')
          note = (
              '### Änderung in 2.5.48\n\n'
              'Importierte Depot-Snapshots unterscheiden jetzt sauber zwischen fehlendem aktuellem Kurs und fehlender Stückzahl. '
              'Ist ein belastbarer EUR-Kurs vorhanden, aber noch keine Stückzahl erfasst, zeigt das Depot ausdrücklich „Stückzahl fehlt“ statt fälschlich „Kurs fehlt“. '
              'Die Kennzahl für fehlende Kurse zählt nur noch tatsächlich fehlende Kurse; die Vollständigkeit des Depotwerts bleibt separat davon abhängig, ob ein aktueller Wert berechenbar ist. '
              'Historische Snapshotwerte werden weiterhin nicht als heutiger Depotwert verwendet.\n\n'
          )
          p.write_text(text.replace(marker, note + marker, 1))

          replace('android/tests/test-version-contract.sh', 'EXPECTED_VERSION_NAME="2.5.47"', 'EXPECTED_VERSION_NAME="2.5.48"')
          replace('android/tests/test-version-contract.sh', 'EXPECTED_VERSION_CODE=117', 'EXPECTED_VERSION_CODE=118')

          p = Path('android/app/src/main/java/de/tobias/investmentradar/PortfolioDashboard.kt')
          text = p.read_text()
          old = '''row.currentValue?.let(::portfolioMoney) ?: when {
              isFixedIncome -> "Anlagebetrag fehlt"
              row.hasUsablePrice -> "Stückzahl fehlt"
              else -> "Kurs fehlt"
          }'''
          new = '''row.currentValue?.let(::portfolioMoney) ?: when {
                        isFixedIncome -> "Anlagebetrag fehlt"
                        row.hasUsablePrice -> "Stückzahl fehlt"
                        else -> "Kurs fehlt"
                    }'''
          if old not in text:
              raise SystemExit('missing portfolio current-value fallback for formatting cleanup')
          p.write_text(text.replace(old, new, 1))
          PY

          bash android/tests/test-portfolio-tracked-shares-ui.sh
          bash android/tests/test-version-contract.sh
          bash scripts/test-current-docs.sh

          git rm .github/workflows/apply-2-5-48-release.yml
      - name: Commit Android 2.5.48 release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md SETUP.md START_HIER.md android/README.md android/app/build.gradle.kts \
            android/app/src/main/java/de/tobias/investmentradar/PortfolioDashboard.kt \
            android/tests/test-version-contract.sh
          git diff --cached --quiet && exit 0
          git commit -m 'release: prepare Android 2.5.48'
          git push origin HEAD:fix/portfolio-missing-value-reason

name: Scan availability copy 2.2

on:
  push:
    branches:
      - feat/investment-radar-2.2
    paths:
      - .github/workflows/scan-unavailable-2.2.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print all availability wording
        run: |
          echo '=== verfügbar occurrences ==='
          grep -Rni 'verfügbar' android/app/src/main/java --include='*.kt' || true

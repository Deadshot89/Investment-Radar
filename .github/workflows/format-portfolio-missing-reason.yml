name: Format portfolio missing value fallback

on:
  push:
    branches:
      - fix/portfolio-missing-value-reason
    paths:
      - '.github/workflows/format-portfolio-missing-reason.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/portfolio-missing-value-reason
      - name: Format fallback block
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/de/tobias/investmentradar/PortfolioDashboard.kt')
          text = p.read_text()
          old = '''                    row.currentValue?.let(::portfolioMoney) ?: when {
              isFixedIncome -> "Anlagebetrag fehlt"
              row.currentPriceEur != null -> "Stückzahl fehlt"
              else -> "Kurs fehlt"
          }
'''
          new = '''                    row.currentValue?.let(::portfolioMoney) ?: when {
                        isFixedIncome -> "Anlagebetrag fehlt"
                        row.currentPriceEur != null -> "Stückzahl fehlt"
                        else -> "Kurs fehlt"
                    }
'''
          if old not in text:
              raise SystemExit('expected unformatted fallback block not found')
          p.write_text(text.replace(old, new, 1))
          PY
          bash android/tests/test-portfolio-tracked-shares-ui.sh
          git rm .github/workflows/format-portfolio-missing-reason.yml
      - name: Commit formatting cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/de/tobias/investmentradar/PortfolioDashboard.kt
          git diff --cached --quiet && exit 0
          git commit -m 'style: format portfolio missing-value fallback'
          git push origin HEAD:fix/portfolio-missing-value-reason

name: Apply Money Management UI

on:
  push:
    paths:
      - '.github/workflows/apply-money-management.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch MainActivity
        run: python .github/scripts/apply_money_management.py
      - name: Commit approved UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt
          git commit -m "feat: integrate money management cockpit"
          git push origin HEAD:main

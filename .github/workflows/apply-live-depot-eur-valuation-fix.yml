name: Apply live depot EUR valuation fix

on:
  push:
    branches:
      - fix/live-depot-eur-valuation
    paths:
      - '.github/workflows/apply-live-depot-eur-valuation-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/live-depot-eur-valuation
      - name: Replace native quote valuation with EUR-comparable valuation
        shell: bash
        run: |
          set -euo pipefail
          file='android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt'
          grep -Fq 'currentValue(top.price)' "$file"
          grep -Fq 'currentValue(item.price)' "$file"
          sed -i 's/currentValue(top\.price)/currentValue(euroComparablePrice(top))/g' "$file"
          sed -i 's/currentValue(item\.price)/currentValue(euroComparablePrice(item))/g' "$file"
          ! grep -Fq 'currentValue(top.price)' "$file"
          ! grep -Fq 'currentValue(item.price)' "$file"
          bash android/tests/test-live-depot-value-ui.sh
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m 'fix: use EUR prices for live depot values'
          git push origin HEAD:fix/live-depot-eur-valuation

name: Apply German Decimal Input Wiring

on:
  push:
    branches:
      - fix/german-decimal-grouping-20261009
    paths:
      - .github/workflows/fix-german-decimal-input.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/german-decimal-grouping-20261009
          fetch-depth: 0
      - name: Wire MainActivity to tested decimal parser
        shell: python
        run: |
          from pathlib import Path

          path = Path("android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt")
          text = path.read_text(encoding="utf-8")
          old = '''private fun parseDecimal(value: String): Double? = value.trim().replace(',', '.').toDoubleOrNull()

          private fun sanitizeDecimalInput(value: String): String {
              val normalized = value.filter { it.isDigit() || it == ',' || it == '.' }.replace('.', ',')
              val firstComma = normalized.indexOf(',')
              return if (firstComma < 0) normalized.take(12) else {
                  normalized.substring(0, firstComma + 1) + normalized.substring(firstComma + 1).replace(",", "").take(6)
              }.take(16)
          }'''
          new = '''private fun parseDecimal(value: String): Double? = GermanDecimalInput.parse(value)

          private fun sanitizeDecimalInput(value: String): String = GermanDecimalInput.sanitize(value)'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one decimal input block, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit targeted patch and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt
          git rm .github/workflows/fix-german-decimal-input.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt
          git commit -m "fix: use tested German decimal parser in app inputs"
          git push origin HEAD:fix/german-decimal-grouping-20261009

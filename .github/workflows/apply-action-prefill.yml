name: Apply Action Prefill Flow

on:
  push:
    paths:
      - '.github/workflows/apply-action-prefill.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch MainActivity
        run: python .github/scripts/apply_action_prefill.py
      - name: Commit action prefill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt
          git commit -m "feat: prefill recommended action amount"
          git push origin HEAD:main

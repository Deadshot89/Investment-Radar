name: Apply MainActivity 2.2 patch

on:
  push:
    branches:
      - feat/investment-radar-2.2
    paths:
      - .github/workflows/patch-mainactivity-2.2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/investment-radar-2.2
          fetch-depth: 0
      - name: Patch MainActivity safely
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt')
          text = path.read_text()

          replacements = [
              (
                  'import androidx.activity.ComponentActivity\n',
                  'import androidx.activity.ComponentActivity\nimport androidx.activity.compose.BackHandler\n'
              ),
              (
                  '    val permissionLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) { }\n\n',
                  '    val permissionLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) { }\n\n'
                  '    BackHandler(enabled = tab != 0 && selectedDetailId == null) {\n'
                  '        tab = 0\n'
                  '    }\n\n'
              ),
              (
                  'else -> missingAlertItemMessage = "Das Wertpapier ist im aktuellen Radar nicht mehr verfügbar."',
                  'else -> missingAlertItemMessage = "Das Wertpapier ist nicht im aktuellen Radar enthalten."'
              ),
              (
                  'title = { Text("Wertpapier nicht verfügbar") },',
                  'title = { Text("Wertpapier nicht im Radar") },'
              ),
              (
                  'if (depotValue != null) "IM DEPOT · ${formatMoney(depotValue)}" else "IM DEPOT · Wert nicht verfügbar"',
                  'if (depotValue != null) "IM DEPOT · ${formatMoney(depotValue)}" else "IM DEPOT · Kurs fehlt"'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, got {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          if 'nicht verfügbar' in text.lower() or 'nicht mehr verfügbar' in text.lower():
              raise SystemExit('Generic unavailable copy still exists in MainActivity')
          if 'BackHandler(enabled = tab != 0 && selectedDetailId == null)' not in text:
              raise SystemExit('Root BackHandler was not inserted')

          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "Investment Radar CI"
          git config user.email "actions@users.noreply.github.com"
          git add android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt
          git diff --cached --check
          git commit -m "fix: wire root back navigation and concrete states"
          git push origin HEAD:feat/investment-radar-2.2

name: IR120 Alert Detail Patch

on:
  push:
    branches:
      - ir120-implementation
    paths:
      - '.github/workflows/ir120-alert-detail-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ir120-implementation
          fetch-depth: 0
      - name: Patch missing alert item feedback
        shell: python
        run: |
          from pathlib import Path

          path = Path('android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt')
          text = path.read_text()

          runtime_import = 'import androidx.compose.runtime.*\n'
          saveable_import = 'import androidx.compose.runtime.saveable.rememberSaveable\n'
          if saveable_import not in text:
              if runtime_import not in text:
                  raise SystemExit('Compose runtime import marker not found')
              text = text.replace(runtime_import, runtime_import + saveable_import, 1)

          state_line = '    var detailReturnTab by remember { mutableIntStateOf(initialTab.coerceIn(0, 3)) }\n'
          state_insert = '    var missingAlertItemMessage by rememberSaveable { mutableStateOf<String?>(null) }\n'
          if state_insert not in text:
              if state_line not in text:
                  raise SystemExit('Detail return state marker not found')
              text = text.replace(state_line, state_line + state_insert, 1)

          token = 'onOpen = { stored ->'
          token_pos = text.find(token)
          if token_pos < 0:
              raise SystemExit('Alert onOpen marker not found')
          block_start = text.rfind('\n', 0, token_pos) + 1
          indent = text[block_start:token_pos]
          next_marker = '\n' + indent + 'onMarkAllRead = vm::markAllAlertsRead,'
          block_end = text.find(next_marker, token_pos)
          if block_end < 0:
              raise SystemExit('Alert onOpen end marker not found')

          lines = [
              'onOpen = { stored ->',
              '    vm.markAlertRead(stored.alert.id)',
              '    val id = stored.alert.itemId',
              '    when {',
              '        s.data.items.any { it.id == id } -> {',
              '            detailReturnTab = 3',
              '            selectedDetailId = id',
              '        }',
              '        customItems.any { it.id == id } -> {',
              '            detailReturnTab = 3',
              '            selectedDetailId = id',
              '        }',
              '        else -> missingAlertItemMessage = "Das Wertpapier ist im aktuellen Radar nicht mehr verfügbar."',
              '    }',
              '},',
          ]
          new_block = '\n'.join(indent + line for line in lines)
          text = text[:block_start] + new_block + text[block_end:]

          dialog_marker = '    availableUpdate?.let { update ->\n'
          if 'title = { Text("Wertpapier nicht verfügbar") }' not in text:
              if dialog_marker not in text:
                  raise SystemExit('Update dialog marker not found')
              dialog_lines = [
                  '    missingAlertItemMessage?.let { message ->',
                  '        AlertDialog(',
                  '            onDismissRequest = { missingAlertItemMessage = null },',
                  '            title = { Text("Wertpapier nicht verfügbar") },',
                  '            text = { Text(message) },',
                  '            confirmButton = {',
                  '                TextButton(onClick = { missingAlertItemMessage = null }) { Text("OK") }',
                  '            }',
                  '        )',
                  '    }',
                  '',
              ]
              dialog = '\n'.join(dialog_lines) + '\n'
              text = text.replace(dialog_marker, dialog + dialog_marker, 1)

          path.write_text(text)
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'investment-radar-ci'
          git config user.email 'investment-radar-ci@users.noreply.github.com'
          git add android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt
          git diff --cached --check
          git commit -m 'feat: handle missing alert investment detail'
          git push origin HEAD:ir120-implementation

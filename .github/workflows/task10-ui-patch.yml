name: Apply Task 10 UI Patch

on:
  push:
    branches:
      - feat/investment-radar-2.3
    paths:
      - '.github/workflows/task10-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/investment-radar-2.3
          fetch-depth: 0
      - name: Apply 2.3 UI patch
        run: python3 tools/task10_patch.py
      - name: Commit patched UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt \
                  android/app/src/main/java/de/tobias/investmentradar/PortfolioDashboard.kt \
                  android/app/src/main/java/de/tobias/investmentradar/RadarScreen.kt \
                  android/app/src/main/java/de/tobias/investmentradar/InvestmentDetailScreen.kt
          git diff --cached --quiet && exit 1
          git commit -m "feat: add actionable 2.3 portfolio advisor UI"
          git push origin HEAD:feat/investment-radar-2.3

name: Apply Live Depot Value 2.0.4 Patch

permissions:
  contents: write

on:
  push:
    branches:
      - feature/live-depot-value-2.0.4
    paths:
      - 'scripts/patch-live-depot-value-204.py'
      - '.github/workflows/live-depot-value-204-patch.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-depot-value-2.0.4
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python scripts/patch-live-depot-value-204.py
      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt
          git commit -m "feat: show current depot value in Live purchase plan"
          git push origin HEAD:feature/live-depot-value-2.0.4

name: Deepfix Money Input Patch

on:
  push:
    branches:
      - deepfix/german-money-input-2.5.34
    paths:
      - .github/workflows/deepfix-money-input-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: deepfix/german-money-input-2.5.34
          fetch-depth: 0
      - name: Replace only the decimal sanitizer
        shell: python
        run: |
          from pathlib import Path

          path = Path("android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt")
          text = path.read_text(encoding="utf-8")
          old = '''private fun sanitizeDecimalInput(value: String): String {
              val normalized = value.filter { it.isDigit() || it == ',' || it == '.' }.replace('.', ',')
              val firstComma = normalized.indexOf(',')
              return if (firstComma < 0) normalized.take(12) else {
                  normalized.substring(0, firstComma + 1) + normalized.substring(firstComma + 1).replace(",", "").take(6)
              }.take(16)
          }'''
          new = '''private fun sanitizeDecimalInput(value: String): String {
              val raw = value.filter { it.isDigit() || it == ',' || it == '.' }
              val lastComma = raw.lastIndexOf(',')
              val lastDot = raw.lastIndexOf('.')
              val decimalIndex = when {
                  lastComma >= 0 && lastDot >= 0 -> maxOf(lastComma, lastDot)
                  lastComma >= 0 -> raw.indexOf(',')
                  lastDot >= 0 -> raw.indexOf('.')
                  else -> -1
              }
              if (decimalIndex < 0) return raw.take(12)

              val integerPart = raw.substring(0, decimalIndex).filter(Char::isDigit)
              val fractionalPart = raw.substring(decimalIndex + 1).filter(Char::isDigit).take(6)
              return "$integerPart,$fractionalPart".take(16)
          }'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one sanitizer block, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Verify targeted diff and remove helper workflow
        run: |
          set -euo pipefail
          git diff --check
          git diff -- android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt
          git rm .github/workflows/deepfix-money-input-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt
          git commit -m "fix: preserve German thousands separators in money input"
          git push origin HEAD:deepfix/german-money-input-2.5.34

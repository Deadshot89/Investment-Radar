name: Apply Investment Radar 1.1.27

permissions:
  contents: write

on:
  push:
    branches:
      - ir127-work
    paths:
      - '.github/workflows/apply-ir127.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ir127-work

      - name: Apply verified 1.1.27 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d _assistant_ir127.patch.gz.b64 | gunzip > /tmp/ir127.patch
          git apply --whitespace=fix /tmp/ir127.patch
          bash scripts/test-1.1.27-portfolio-fallback.sh
          cd backend
          npm install --no-audit --no-fund
          npm test
          cd ..

      - name: Commit only verified 1.1.27 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Investment Radar Builder'
          git config user.email 'actions@github.com'

          # These legacy side products are not part of the verified 1.1.27 patch.
          rm -f backend/server.js backend/render.yaml

          # backend-deploy.yml is intentionally not staged here because the
          # Actions token cannot update workflow files. It will be updated
          # directly through GitHub after this verified commit is pushed.
          git add \
            android/app/build.gradle.kts \
            android/app/src/main/java/de/tobias/investmentradar/CustomInvestmentStore.kt \
            android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt \
            android/app/src/main/java/de/tobias/investmentradar/MainViewModel.kt \
            backend/package.json \
            backend/src/functions/health.mjs \
            backend/src/lib/customAsset.mjs \
            HOTFIX_1.1.27.md \
            scripts/test-1.1.27-portfolio-fallback.sh

          git rm -f _assistant_ir127.patch.gz.b64

          staged="$(git diff --cached --name-only)"
          printf '%s\n' "$staged"
          if printf '%s\n' "$staged" | grep -Eq '(^|/)(server\.js|render\.yaml|\.github/workflows/backend-deploy\.yml)$'; then
            echo 'Unexpected restricted file is staged.' >&2
            exit 1
          fi

          git commit -m 'Investment Radar 1.1.27 portfolio and quote fixes'

      - name: Push 1.1.27 branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:ir127-work

name: IR120 Shared Plan Patch

on:
  push:
    branches:
      - ir120-implementation
    paths:
      - '.github/workflows/ir120-shared-plan-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ir120-implementation
          fetch-depth: 0
      - name: Share personal plan with dashboard
        shell: python
        run: |
          from pathlib import Path
          path = Path('android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt')
          text = path.read_text()
          old_parent = '                        val personalById = RecommendationEngine.plan(\n                            s.data.items,\n                            budget,\n                            PortfolioAnalysis.values(s.data.items, positions, customItems)\n                        ).items.associateBy { it.itemId }'
          new_parent = '                        val personalPlan = RecommendationEngine.plan(\n                            s.data.items,\n                            budget,\n                            PortfolioAnalysis.values(s.data.items, positions, customItems)\n                        )\n                        val personalById = personalPlan.items.associateBy { it.itemId }'
          if old_parent not in text: raise SystemExit('Parent recommendation block not found')
          text = text.replace(old_parent, new_parent, 1)
          old_call = '                                positions = positions,\n                                watchlistIds = watchlistIds,\n                                onEditBudget = { budgetDialog = true },'
          new_call = '                                positions = positions,\n                                watchlistIds = watchlistIds,\n                                personalPlan = personalPlan,\n                                onEditBudget = { budgetDialog = true },'
          if old_call not in text: raise SystemExit('Dashboard call marker not found')
          text = text.replace(old_call, new_call, 1)
          old_signature = '    positions: Map<String, PortfolioPosition>,\n    watchlistIds: Set<String>,\n    onEditBudget: () -> Unit,'
          new_signature = '    positions: Map<String, PortfolioPosition>,\n    watchlistIds: Set<String>,\n    personalPlan: PersonalPlan,\n    onEditBudget: () -> Unit,'
          if old_signature not in text: raise SystemExit('Dashboard signature marker not found')
          text = text.replace(old_signature, new_signature, 1)
          old_local = '    val currentValues = data.items.associate { item ->\n        val position = positions[item.id]\n        val value = position?.currentValue(euroComparablePrice(item)) ?: position?.investedAmount ?: 0.0\n        item.id to value.coerceAtLeast(0.0)\n    }\n    val personalPlan = RecommendationEngine.plan(data.items, budget, currentValues)\n    val cashAmount = personalPlan.cashAmount'
          new_local = '    val cashAmount = personalPlan.cashAmount'
          if old_local not in text: raise SystemExit('Duplicate Dashboard plan block not found')
          text = text.replace(old_local, new_local, 1)
          path.write_text(text)
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'investment-radar-ci'
          git config user.email 'investment-radar-ci@users.noreply.github.com'
          git add android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt
          git diff --cached --check
          git commit -m 'fix: share portfolio-aware plan with dashboard'
          git push origin HEAD:ir120-implementation

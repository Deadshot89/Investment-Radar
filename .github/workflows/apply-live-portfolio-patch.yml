name: Apply live portfolio patch

on:
  push:
    branches:
      - feature/live-portfolio-summary
    paths:
      - '.github/workflows/apply-live-portfolio-patch.yml'
      - '.github/scripts/apply_live_portfolio_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-portfolio-summary
      - name: Apply deterministic patch
        run: python .github/scripts/apply_live_portfolio_patch.py
      - name: Commit patch if changed
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt
          git commit -m "feat: show portfolio on live dashboard"
          git push origin HEAD:feature/live-portfolio-summary

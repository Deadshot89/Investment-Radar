name: Apply advisor UI label fix

on:
  push:
    branches:
      - fix/unreliable-advisor-ui-label
    paths:
      - '.github/workflows/apply-unreliable-advisor-ui-label-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/unreliable-advisor-ui-label
      - name: Replace misleading HOLD labels
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            android/app/src/main/java/de/tobias/investmentradar/PortfolioDashboard.kt \
            android/app/src/main/java/de/tobias/investmentradar/RadarScreen.kt \
            android/app/src/main/java/de/tobias/investmentradar/InvestmentDetailScreen.kt; do
            sed -i 's/Halten · Daten prüfen/Keine belastbare Bewertung/g' "$file"
          done
          bash android/tests/test-portfolio-advisor-2-3-ui.sh
          ! grep -R -Fq 'Halten · Daten prüfen' android/app/src/main/java/de/tobias/investmentradar
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            android/app/src/main/java/de/tobias/investmentradar/PortfolioDashboard.kt \
            android/app/src/main/java/de/tobias/investmentradar/RadarScreen.kt \
            android/app/src/main/java/de/tobias/investmentradar/InvestmentDetailScreen.kt
          git diff --cached --quiet && exit 0
          git commit -m 'fix: stop showing hold for unreliable advisor data in UI'
          git push origin HEAD:fix/unreliable-advisor-ui-label

name: Apply header version UI

on:
  push:
    paths:
      - '.github/workflows/apply-header-version-ui.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply approved header UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt')
          s = main.read_text()
          replacements = [
              ('var availableUpdate by remember { mutableStateOf<AppUpdateInfo?>(null) }\n    var updateStatusMessage', 'var availableUpdate by remember { mutableStateOf<AppUpdateInfo?>(null) }\n    var updateDialogVisible by remember { mutableStateOf(false) }\n    var updateStatusMessage'),
              ('if (updateCheckRequested == 0) {\n            availableUpdate = AppUpdateManager.check(context)\n        } else {', 'if (updateCheckRequested == 0) {\n            val update = AppUpdateManager.check(context)\n            availableUpdate = update\n            updateDialogVisible = update != null\n        } else {'),
              ('is UpdateCheckResult.Available -> availableUpdate = result.update', 'is UpdateCheckResult.Available -> {\n                    availableUpdate = result.update\n                    updateDialogVisible = true\n                }'),
              ('is UpdateCheckResult.Current -> updateStatusMessage = "Du nutzt bereits die aktuelle Version ${result.versionName}."', 'is UpdateCheckResult.Current -> {\n                    availableUpdate = null\n                    updateStatusMessage = "Du nutzt bereits die aktuelle Version ${result.versionName}."\n                }'),
              ('TextButton(onClick = { updateCheckRequested++ }) { Text("Update") }', 'TextButton(onClick = {\n                            if (availableUpdate != null) updateDialogVisible = true else updateCheckRequested++\n                        }) {\n                            Text(\n                                if (availableUpdate != null) "Update verfügbar · v${availableUpdate!!.versionName}" else "v${BuildConfig.VERSION_NAME}",\n                                color = if (availableUpdate != null) RadarGreen else RadarMuted,\n                                style = MaterialTheme.typography.labelMedium,\n                                fontWeight = if (availableUpdate != null) FontWeight.Bold else FontWeight.Medium\n                            )\n                        }'),
              ('availableUpdate?.let { update ->\n        AlertDialog(\n            onDismissRequest = { availableUpdate = null },', 'if (updateDialogVisible) availableUpdate?.let { update ->\n        AlertDialog(\n            onDismissRequest = { updateDialogVisible = false },'),
              ('AppUpdateManager.openUpdate(context, update)\n                    availableUpdate = null', 'AppUpdateManager.openUpdate(context, update)\n                    updateDialogVisible = false'),
              ('dismissButton = { TextButton(onClick = { availableUpdate = null }) { Text("Später") } }', 'dismissButton = { TextButton(onClick = { updateDialogVisible = false }) { Text("Später") } }'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Header UI anchor missing: {old}')
              s = s.replace(old, new, 1)
          main.write_text(s)
          PY
          rm .github/workflows/apply-header-version-ui.yml
          git config user.name "Deadshot89"
          git config user.email "86518220+Deadshot89@users.noreply.github.com"
          git add android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt \
                  .github/workflows/apply-header-version-ui.yml
          git commit -m "feat: show app version and update badge"
          git push origin HEAD:main

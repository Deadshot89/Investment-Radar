name: Apply portfolio price state compatibility fix

on:
  push:
    branches:
      - fix/portfolio-missing-value-reason
    paths:
      - '.github/workflows/apply-portfolio-price-state-compatibility-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/portfolio-missing-value-reason
      - name: Use explicit current-price availability in UI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/de/tobias/investmentradar/PortfolioDashboard.kt')
          text = p.read_text()
          old = 'row.hasUsablePrice -> "Stückzahl fehlt"'
          new = 'row.currentPriceEur != null -> "Stückzahl fehlt"'
          if old not in text:
              raise SystemExit('expected portfolio fallback condition not found')
          p.write_text(text.replace(old, new, 1))
          PY
          grep -Fq 'row.currentPriceEur != null -> "Stückzahl fehlt"' android/app/src/main/java/de/tobias/investmentradar/PortfolioDashboard.kt
          git rm .github/workflows/apply-portfolio-price-state-compatibility-fix.yml
      - name: Commit compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/de/tobias/investmentradar/PortfolioDashboard.kt
          git diff --cached --quiet && exit 0
          git commit -m 'fix: use explicit quote availability for missing-share label'
          git push origin HEAD:fix/portfolio-missing-value-reason

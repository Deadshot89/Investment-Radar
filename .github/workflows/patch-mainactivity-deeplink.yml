name: Patch MainActivity Deep Link

on:
  push:
    paths:
      - '.github/workflows/patch-mainactivity-deeplink.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch MainActivity safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt')
          s = p.read_text()
          old = '        setContent { InvestmentRadarUi(initialTab = if (intent.getBooleanExtra("openAlerts", false)) 3 else 0) }'
          new = '''        val openItemId = intent.getStringExtra("openItemId")?.takeIf { it.isNotBlank() }\n        val openAlerts = intent.getBooleanExtra("openAlerts", false)\n        setContent {\n            InvestmentRadarUi(\n                initialTab = if (openAlerts || openItemId != null) 3 else 0,\n                initialDetailId = openItemId\n            )\n        }'''
          if old not in s:
              raise SystemExit('onCreate anchor not found')
          s = s.replace(old, new, 1)
          old = 'fun InvestmentRadarUi(vm: MainViewModel = viewModel(), initialTab: Int = 0) {'
          new = '''fun InvestmentRadarUi(\n    vm: MainViewModel = viewModel(),\n    initialTab: Int = 0,\n    initialDetailId: String? = null\n) {'''
          if old not in s:
              raise SystemExit('InvestmentRadarUi signature anchor not found')
          s = s.replace(old, new, 1)
          old = '''    var selectedDetailId by remember { mutableStateOf<String?>(null) }\n    var detailReturnTab by remember { mutableIntStateOf(initialTab.coerceIn(0, 3)) }'''
          new = '''    var selectedDetailId by remember { mutableStateOf(initialDetailId?.takeIf { it.isNotBlank() }) }\n    var detailReturnTab by remember { mutableIntStateOf(if (initialDetailId.isNullOrBlank()) initialTab.coerceIn(0, 3) else 3) }'''
          if old not in s:
              raise SystemExit('detail state anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "feat: open push alerts directly in investment detail"
          git push

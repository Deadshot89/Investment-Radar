name: Apply 2.2 Detail Cleanup

on:
  push:
    branches:
      - feat/investment-radar-2.2
    paths:
      - '.github/workflows/apply-2-2-detail-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/investment-radar-2.2
      - name: Remove obsolete savings push detail branch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/de/tobias/investmentradar/InvestmentDetailScreen.kt')
          text = p.read_text()
          start = text.index('    val hostActivity = context as? MainActivity\n')
          end = text.index('    if (effectiveItem == null) {\n', start)
          text = text[:start] + text[end:]
          p.write_text(text)
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/de/tobias/investmentradar/InvestmentDetailScreen.kt
          git diff --cached --check
          git commit -m "fix: remove obsolete savings push detail route"
          git push origin HEAD:feat/investment-radar-2.2

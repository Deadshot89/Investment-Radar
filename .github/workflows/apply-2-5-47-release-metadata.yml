name: Apply Android 2.5.47 release metadata

on:
  push:
    branches:
      - fix/live-depot-eur-valuation
    paths:
      - '.github/workflows/apply-2-5-47-release-metadata.yml'

permissions:
  contents: write

jobs:
  apply-release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/live-depot-eur-valuation
      - name: Update version and current documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=-1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old}")
              p.write_text(text.replace(old, new, count))

          replace('android/app/build.gradle.kts', 'versionCode = 116', 'versionCode = 117', 1)
          replace('android/app/build.gradle.kts', 'versionName = "2.5.46"', 'versionName = "2.5.47"', 1)
          replace('android/app/build.gradle.kts', '// Release candidate: Investment Radar 2.5.46', '// Release candidate: Investment Radar 2.5.47', 1)

          replace('README.md', '**Aktueller Android-Stand:** 2.5.46 / versionCode 116', '**Aktueller Android-Stand:** 2.5.47 / versionCode 117', 1)
          replace('SETUP.md', '`versionName = 2.5.46`', '`versionName = 2.5.47`', 1)
          replace('SETUP.md', '`versionCode = 116`', '`versionCode = 117`', 1)
          replace('START_HIER.md', '# START HIER – Investment Radar 2.5.46', '# START HIER – Investment Radar 2.5.47', 1)
          replace('START_HIER.md', '**Android:** 2.5.46 / versionCode 116', '**Android:** 2.5.47 / versionCode 117', 1)
          replace('START_HIER.md', '`versionName = 2.5.46`', '`versionName = 2.5.47`', 1)
          replace('START_HIER.md', '`versionCode = 116`', '`versionCode = 117`, 1)

          p = Path('android/README.md')
          text = p.read_text()
          text = text.replace('**Version:** 2.5.46  ', '**Version:** 2.5.47  ', 1)
          text = text.replace('**versionCode:** 116', '**versionCode:** 117', 1)
          marker = '### Änderung in 2.5.46\n'
          if marker not in text:
              raise SystemExit('missing 2.5.46 release-note marker')
          note = (
              '### Änderung in 2.5.47\n\n'
              'Live-Dashboard und heutige Empfehlung bewerten Depotpositionen jetzt mit demselben EUR-vergleichbaren Kurs wie die Portfolio-Berechnung. '
              'Bei Fremdwährungswerten wird der native USD-/sonstige Kurs nicht mehr fälschlich als Euro verwendet; fehlt eine belastbare EUR-Umrechnung, wird kein EUR-Depotwert erfunden.\n\n'
          )
          p.write_text(text.replace(marker, note + marker, 1))

          replace('android/tests/test-version-contract.sh', 'EXPECTED_VERSION_NAME="2.5.46"', 'EXPECTED_VERSION_NAME="2.5.47"', 1)
          replace('android/tests/test-version-contract.sh', 'EXPECTED_VERSION_CODE=116', 'EXPECTED_VERSION_CODE=117', 1)
          PY
          bash android/tests/test-live-depot-value-ui.sh
          bash android/tests/test-version-contract.sh
          bash scripts/test-current-docs.sh
      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md SETUP.md START_HIER.md android/README.md android/app/build.gradle.kts android/tests/test-version-contract.sh
          git diff --cached --quiet && exit 0
          git commit -m 'release: bump Android to 2.5.47'
          git push origin HEAD:fix/live-depot-eur-valuation

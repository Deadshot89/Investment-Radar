name: Apply push alert read fix

on:
  push:
    paths:
      - '.github/workflows/apply-push-alert-read-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply minimal approved changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          push = Path('android/app/src/main/java/de/tobias/investmentradar/InvestmentMessagingService.kt')
          s = push.read_text()
          replacements = [
              ('showNotification(title, body, level, id.hashCode(), itemId)', 'showNotification(title, body, level, id.hashCode(), itemId, id)'),
              ('private fun showNotification(title: String, body: String, level: String, id: Int, itemId: String) {', 'private fun showNotification(title: String, body: String, level: String, id: Int, itemId: String, alertId: String) {'),
              ('if (itemId.isNotBlank()) putExtra("openItemId", itemId)\n            flags =', 'if (itemId.isNotBlank()) putExtra("openItemId", itemId)\n            putExtra("openAlertId", alertId)\n            flags ='),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Push anchor missing: {old}')
              s = s.replace(old, new, 1)
          push.write_text(s)

          main = Path('android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt')
          s = main.read_text()
          replacements = [
              ('private var pendingOpenItemId by mutableStateOf<String?>(null)\n    private var pendingOpenAlerts', 'private var pendingOpenItemId by mutableStateOf<String?>(null)\n    private var pendingOpenAlertId by mutableStateOf<String?>(null)\n    private var pendingOpenAlerts'),
              ('initialDetailId = pendingOpenItemId,\n                pushNavigationRequest', 'initialDetailId = pendingOpenItemId,\n                initialAlertId = pendingOpenAlertId,\n                pushNavigationRequest'),
              ('pendingOpenItemId = intent.getStringExtra("openItemId")?.takeIf { it.isNotBlank() }\n        pendingOpenAlerts', 'pendingOpenItemId = intent.getStringExtra("openItemId")?.takeIf { it.isNotBlank() }\n        pendingOpenAlertId = intent.getStringExtra("openAlertId")?.takeIf { it.isNotBlank() }\n        pendingOpenAlerts'),
              ('initialDetailId: String? = null,\n    pushNavigationRequest', 'initialDetailId: String? = null,\n    initialAlertId: String? = null,\n    pushNavigationRequest'),
              ('selectedDetailId = initialDetailId?.takeIf { it.isNotBlank() }\n        }\n    }', 'selectedDetailId = initialDetailId?.takeIf { it.isNotBlank() }\n            initialAlertId?.takeIf { it.isNotBlank() }?.let { vm.markAlertRead(it) }\n        }\n    }'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Main anchor missing: {old}')
              s = s.replace(old, new, 1)
          main.write_text(s)

          gradle = Path('android/app/build.gradle.kts')
          s = gradle.read_text()
          for old, new in [
              ('versionCode = 32', 'versionCode = 33'),
              ('versionName = "1.2.1"', 'versionName = "1.2.2"'),
              ('// Build trigger: Investment Radar 1.2.1', '// Build trigger: Investment Radar 1.2.2'),
          ]:
              if old not in s:
                  raise SystemExit(f'Gradle anchor missing: {old}')
              s = s.replace(old, new, 1)
          gradle.write_text(s)
          PY
          rm .github/workflows/apply-push-alert-read-fix.yml
          git config user.name "Deadshot89"
          git config user.email "86518220+Deadshot89@users.noreply.github.com"
          git add android/app/src/main/java/de/tobias/investmentradar/InvestmentMessagingService.kt \
                  android/app/src/main/java/de/tobias/investmentradar/MainActivity.kt \
                  android/app/build.gradle.kts \
                  .github/workflows/apply-push-alert-read-fix.yml
          git commit -m "feat: mark opened push alert as read"
          git push origin HEAD:main

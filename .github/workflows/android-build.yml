name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        id: apk_build
        working-directory: android
        env:
          API_URL: ${{ vars.INVESTMENT_API_BASE_URL }}
          FB_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FB_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FB_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FB_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
        shell: bash
        run: |
          set +e
          set -o pipefail

          if [[ ! "$API_URL" =~ ^https://[^/]+ ]]; then
            echo "## Android Build" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ Backend-URL fehlt. Es wird bewusst keine nicht funktionsfähige APK erzeugt." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Setze die Repository-Variable **INVESTMENT_API_BASE_URL** auf die vollständige Azure-Flex-Standarddomain inklusive https://." >> "$GITHUB_STEP_SUMMARY"
            echo "Bei Flex Consumption darf die URL nicht aus dem App-Namen abgeleitet werden." >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi

          echo "Backend für APK: $API_URL"
          gradle --no-daemon --stacktrace :app:assembleDebug \
            -PINVESTMENT_API_BASE_URL="$API_URL" \
            -PFIREBASE_APP_ID="$FB_APP_ID" \
            -PFIREBASE_API_KEY="$FB_API_KEY" \
            -PFIREBASE_PROJECT_ID="$FB_PROJECT_ID" \
            -PFIREBASE_SENDER_ID="$FB_SENDER_ID" 2>&1 | tee android-build.log
          code=${PIPESTATUS[0]}

          echo "## Android Build" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 0 ]; then
            echo "✅ APK erfolgreich gebaut." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ APK-Build fehlgeschlagen (Exit $code)." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Relevante Fehlermeldungen" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -E "(^e: |^ERROR:|^FAILURE:|What went wrong|Could not resolve|Could not find|Unresolved reference|error: )" android-build.log | tail -n 80 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: investment-radar-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/android-build.log
          if-no-files-found: warn

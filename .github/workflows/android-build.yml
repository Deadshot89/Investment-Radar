name: Build Android APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Updater regression test
        shell: bash
        run: bash android/tests/test-update-resume.sh

      - name: Trade Republic link regression test
        shell: bash
        run: bash android/tests/test-trade-republic-links.sh

      - name: Analysis V2 UI regression test
        shell: bash
        run: bash android/tests/test-analysis-v2-ui.sh

      - name: Portfolio allocation UI regression test
        shell: bash
        run: bash android/tests/test-portfolio-allocation-ui.sh

      - name: Alert policy wiring regression test
        shell: bash
        run: bash android/tests/test-alert-policy-wiring.sh

      - name: Alert center UI regression test
        shell: bash
        run: bash android/tests/test-alert-center-ui.sh

      - name: Validate build and signing configuration
        env:
          API_URL: ${{ vars.INVESTMENT_API_BASE_URL }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FB_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FB_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FB_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FB_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          REPOSITORY_SLUG: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$API_URL" =~ ^https://[^/]+ ]]; then
            echo "## Android Build" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ INVESTMENT_API_BASE_URL fehlt oder ist ungültig." >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          missing=0
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD FB_APP_ID FB_API_KEY FB_PROJECT_ID FB_SENDER_ID REPOSITORY_SLUG; do
            if [ -z "${!name:-}" ]; then
              echo "❌ $name fehlt" >> "$GITHUB_STEP_SUMMARY"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Es wird bewusst keine nicht updatefähige APK erzeugt." >> "$GITHUB_STEP_SUMMARY"
            exit 3
          fi

      - name: Restore permanent Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/investment-radar-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Android JVM unit tests
        working-directory: android
        env:
          API_URL: ${{ vars.INVESTMENT_API_BASE_URL }}
          FB_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FB_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FB_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FB_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          REPOSITORY_SLUG: ${{ github.repository }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          gradle --no-daemon :app:testDebugUnitTest \
            -PINVESTMENT_API_BASE_URL="$API_URL" \
            -PFIREBASE_APP_ID="$FB_APP_ID" \
            -PFIREBASE_API_KEY="$FB_API_KEY" \
            -PFIREBASE_PROJECT_ID="$FB_PROJECT_ID" \
            -PFIREBASE_SENDER_ID="$FB_SENDER_ID" \
            -PGITHUB_REPOSITORY="$REPOSITORY_SLUG" \
            -PANDROID_KEYSTORE_PATH="$ANDROID_KEYSTORE_PATH" \
            -PANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PANDROID_KEY_ALIAS="$KEY_ALIAS" \
            -PANDROID_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Build signed release APK
        id: apk_build
        working-directory: android
        env:
          API_URL: ${{ vars.INVESTMENT_API_BASE_URL }}
          FB_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FB_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FB_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FB_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          REPOSITORY_SLUG: ${{ github.repository }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease \
            -PINVESTMENT_API_BASE_URL="$API_URL" \
            -PFIREBASE_APP_ID="$FB_APP_ID" \
            -PFIREBASE_API_KEY="$FB_API_KEY" \
            -PFIREBASE_PROJECT_ID="$FB_PROJECT_ID" \
            -PFIREBASE_SENDER_ID="$FB_SENDER_ID" \
            -PGITHUB_REPOSITORY="$REPOSITORY_SLUG" \
            -PANDROID_KEYSTORE_PATH="$ANDROID_KEYSTORE_PATH" \
            -PANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PANDROID_KEY_ALIAS="$KEY_ALIAS" \
            -PANDROID_KEY_PASSWORD="$KEY_PASSWORD" 2>&1 | tee android-build.log
          code=${PIPESTATUS[0]}
          echo "## Android Build" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 0 ]; then
            echo "✅ Signierte Release-APK erfolgreich gebaut." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ APK-Build fehlgeschlagen (Exit $code)." >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -E "(^e: |^ERROR:|^FAILURE:|What went wrong|Could not resolve|Could not find|Unresolved reference|error: )" android-build.log | tail -n 80 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      - name: Verify APK signature
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          echo "✅ APK-Signatur erfolgreich geprüft." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify live backend before Android publish
        if: success() && github.ref == 'refs/heads/main'
        env:
          BASE_URL: ${{ vars.INVESTMENT_API_BASE_URL }}
          EXPECTED_BACKEND_VERSION: "2.1.0"
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_URL"
          HEALTH_URL="${BASE_URL%/}/api/health"
          RADAR_URL="${BASE_URL%/}/api/radar?page=1&pageSize=1&tradeRepublicVerified=true"
          ok=false
          last_version=""
          last_universe="0"
          health_status="000"
          radar_status="000"
          for attempt in $(seq 1 24); do
            health_status=$(curl --silent --show-error --max-time 20 --output /tmp/android-health.json --write-out "%{http_code}" "$HEALTH_URL" || true)
            radar_status=$(curl --silent --show-error --max-time 30 --output /tmp/android-radar.json --write-out "%{http_code}" "$RADAR_URL" || true)
            if [ "$health_status" = "200" ]; then
              last_version=$(node -e 'const fs=require("fs"); try { const j=JSON.parse(fs.readFileSync("/tmp/android-health.json","utf8")); process.stdout.write(String(j.backendVersion ?? "")); } catch { process.stdout.write(""); }')
            fi
            if [ "$radar_status" = "200" ]; then
              last_universe=$(node -e 'const fs=require("fs"); try { const j=JSON.parse(fs.readFileSync("/tmp/android-radar.json","utf8")); process.stdout.write(String(j.universeTotal ?? 0)); } catch { process.stdout.write("0"); }')
            fi
            echo "Radar gate attempt $attempt/24: health=$health_status backend=${last_version:-<fehlt>} radar=$radar_status universe=${last_universe:-0}"
            if [ "$health_status" = "200" ] && [ "$radar_status" = "200" ] && [ "$last_version" = "$EXPECTED_BACKEND_VERSION" ] && [ "${last_universe:-0}" -ge 2000 ]; then
              ok=true
              break
            fi
            sleep 15
          done
          if [ "$ok" != "true" ]; then
            echo "❌ Android-Publish blockiert: health=$health_status, Backend ${last_version:-<fehlt>}, radar=$radar_status, Radar ${last_universe:-0}/2000." >> "$GITHUB_STEP_SUMMARY"
            echo "Health-Antwort:" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/android-health.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Radar-Antwort:" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/android-radar.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            exit 1
          fi
          echo "✅ Backend $EXPECTED_BACKEND_VERSION live; Radar ${last_universe} Werte; Android-Publish freigegeben." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish APK for in-app updates
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n 1)
          test -n "$VERSION_NAME"
          TAG="v$VERSION_NAME"
          RELEASE_APK="$RUNNER_TEMP/investment-radar.apk"
          cp "$APK" "$RELEASE_APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            CURRENT_APP_TREE=$(git rev-parse "HEAD:android/app")
            RELEASE_APP_TREE=$(git rev-parse "$TAG:android/app")
            if [ "$CURRENT_APP_TREE" != "$RELEASE_APP_TREE" ]; then
              echo "❌ Release $TAG existiert bereits mit anderem App-Code. Version erhöhen, statt dieselbe Version zu überschreiben." >> "$GITHUB_STEP_SUMMARY"
              exit 4
            fi
            echo "✅ Release $TAG existiert bereits; App-Code ist identisch und bleibt unverändert veröffentlicht." >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$TAG" "$RELEASE_APK#investment-radar.apk" \
              --title "Investment Radar $VERSION_NAME" \
              --notes "Investment Radar 2.1: großes Trade-Republic-Radar mit mindestens 2.000 Aktien und ETFs, exaktem Kaufen-Filter, Radar-Zählern und gecachter serverseitiger Analyse."
            echo "✅ Release $TAG für In-App-Updates veröffentlicht." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: investment-radar-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: |
            android/android-build.log
            apk-signature.txt
          if-no-files-found: warn

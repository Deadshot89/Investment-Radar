name: Build Android APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate build and signing configuration
        env:
          API_URL: ${{ vars.INVESTMENT_API_BASE_URL }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FB_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FB_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FB_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FB_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          REPOSITORY_SLUG: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$API_URL" =~ ^https://[^/]+ ]]; then
            echo "## Android Build" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ INVESTMENT_API_BASE_URL fehlt oder ist ungültig." >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi

          missing=0
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD FB_APP_ID FB_API_KEY FB_PROJECT_ID FB_SENDER_ID REPOSITORY_SLUG; do
            if [ -z "${!name:-}" ]; then
              echo "❌ $name fehlt" >> "$GITHUB_STEP_SUMMARY"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Es wird bewusst keine nicht updatefähige APK erzeugt." >> "$GITHUB_STEP_SUMMARY"
            exit 3
          fi

      - name: Restore permanent Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/investment-radar-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        id: apk_build
        working-directory: android
        env:
          API_URL: ${{ vars.INVESTMENT_API_BASE_URL }}
          FB_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FB_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FB_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FB_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          REPOSITORY_SLUG: ${{ github.repository }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease \
            -PINVESTMENT_API_BASE_URL="$API_URL" \
            -PFIREBASE_APP_ID="$FB_APP_ID" \
            -PFIREBASE_API_KEY="$FB_API_KEY" \
            -PFIREBASE_PROJECT_ID="$FB_PROJECT_ID" \
            -PFIREBASE_SENDER_ID="$FB_SENDER_ID" \
            -PGITHUB_REPOSITORY="$REPOSITORY_SLUG" \
            -PANDROID_KEYSTORE_PATH="$ANDROID_KEYSTORE_PATH" \
            -PANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PANDROID_KEY_ALIAS="$KEY_ALIAS" \
            -PANDROID_KEY_PASSWORD="$KEY_PASSWORD" 2>&1 | tee android-build.log
          code=${PIPESTATUS[0]}

          echo "## Android Build" >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 0 ]; then
            echo "✅ Signierte Release-APK erfolgreich gebaut." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ APK-Build fehlgeschlagen (Exit $code)." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Relevante Fehlermeldungen" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -E "(^e: |^ERROR:|^FAILURE:|What went wrong|Could not resolve|Could not find|Unresolved reference|error: )" android-build.log | tail -n 80 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      - name: Verify APK signature
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          echo "✅ APK-Signatur erfolgreich geprüft." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish APK for in-app updates
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n 1)
          test -n "$VERSION_NAME"
          TAG="v$VERSION_NAME"
          RELEASE_APK="$RUNNER_TEMP/investment-radar.apk"
          cp "$APK" "$RELEASE_APK"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_APK#investment-radar.apk" --clobber
          else
            gh release create "$TAG" "$RELEASE_APK#investment-radar.apk" \
              --title "Investment Radar $VERSION_NAME" \
              --notes "Automatisch veröffentlichte, dauerhaft signierte Investment-Radar-APK."
          fi
          echo "✅ Release $TAG für In-App-Updates veröffentlicht." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: investment-radar-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: |
            android/android-build.log
            apk-signature.txt
          if-no-files-found: warn
